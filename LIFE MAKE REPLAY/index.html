<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Replay</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            Life<span>Replay</span>
        </div>

        <a href="#" class="nav-btn">Enter App</a>
    </nav>

    <main class="hero">
        <div class="badge">
            YOUR DAY REIMAGINED
        </div>

        <h1>
            Your day
            <br>
            <span>Your choices</span>
            <br>
            Your story
        </h1>

        <p class="description">
            turn your everyday activities into beautiful
            visual story and discover how you spend your time
        </p>

        <a href="dashboard.html" class="start-btn">Start my day<span></span></a>

        <p class="hint">
            no account required start in seconds
        </p>

    </main>

    <div class="activity-card card-one">
        <div class="activity-icon">

        </div>

        <div>
            <strong>College</strong>
            <small>09:00 AM</small>
        </div>

    </div>

    <div class="activity-card card-two">

        <div class="activity-icon">

        </div>

        <div>
            <strong>Coding</strong>
            <small>11:00 AM</small>
        </div>
    </div>

    <div class="activity-card card-three">

        <div class="activity-icon">

        </div>

        <div>
            <strong>Happy</strong>
            <small>Today's Mood</small>
        </div>
        
    </div>

    <script src="script.js"></script>

</body>
</html>
